# AsyncAPI workflow dispatch for mixi-romi organization
name: Dispatch to romicore-sdk-asyncapi (public)

on:
  push:
    branches: [main]
    paths:
      - "src/romicoresdk/payload/**"
  # workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # run only if the repository belongs to mixi-romi
    if: github.repository == 'mixi-romi/romicore-sdk-py'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ROMICORE_SDK_DOC_APP_ID }}
          private-key: ${{ secrets.ROMICORE_SDK_DOC_APP_PRIVATE_KEY }}
          owner: mixi-romi
          repositories: romicore-sdk-asyncapi

      - name: Send repository_dispatch to romicore-sdk-asyncapi
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/repos/mixi-romi/romicore-sdk-asyncapi/dispatches \
            -d '{"event_type":"schema-updated","client_payload":{"sha":"${{ github.sha }}"}}'
